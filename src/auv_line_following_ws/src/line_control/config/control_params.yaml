line_follower_controller_node:
  ros__parameters:
    line_error_topic: "/line_follower/line_error"
    cmd_vel_topic: "/auv/cmd_vel"
    state_topic: "/line_follower/state"

    # Yaw (dönme) PID -> angle_error girdisi
    yaw_kp: 0.02
    yaw_ki: 0.0
    yaw_kd: 0.005
    max_yaw_rate: 0.6

    # Sway (yanal) PID -> x_error girdisi
    sway_kp: 0.004
    sway_ki: 0.0
    sway_kd: 0.001
    max_sway_speed: 0.3

    # Surge (ileri hız)
    nominal_surge_speed: 0.35
    min_surge_speed: 0.05

    # Çizgi kaybı davranışı
    search_yaw_rate: 0.25
    hold_timeout_sec: 8.0

    # Watchdog
    watchdog_period_sec: 0.5
    message_timeout_sec: 1.0
